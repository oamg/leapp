# See the documentation for more information:
# https://packit.dev/docs/configuration/

specfile_path: packaging/leapp.spec

upstream_project_url: https://github.com/oamg/leapp
merge_pr_in_ci: false

srpm_build_deps: []

osh_diff_scan_after_copr_build: false

# ====================================================================== #
# Anchor library                                                         #
# ---------------------------------------------------------------------- #
# Packit drops the top-level `_` key before validating (it is declared in #
# packit's own schema as "YAML anchor placeholders"), so everything below #
# is purely a place to define YAML anchors. Nothing here runs on its own; #
# only `jobs:` does.                                                      #
#                                                                        #
# IMPORTANT: `<<:` is a *shallow* merge, and packit's own merge of        #
# `tf_extra_params` into the Testing Farm payload silently drops any      #
# subtree whose type does not match (dict vs list). `test:` must stay a   #
# mapping -- a one-item list there is discarded without any error and the #
# plan filter never reaches Testing Farm.                                 #
# ====================================================================== #
_:

  # -------------------------------------------------------------------- #
  # copr_build                                                            #
  # -------------------------------------------------------------------- #
  copr-actions-pr: &copr-actions-pr
    post-upstream-clone:
      # builds from PRs should have lower NVR than those from main branch
      - sed -i "s/1%{?dist}/0%{?dist}/g" packaging/leapp.spec
    get-current-version:
      # get version from spec file instead from git tag
      - bash -c "grep -m1 '^Version:' packaging/leapp.spec | grep -om1 '[0-9].[0-9.]**'"

  copr-actions-main: &copr-actions-main
    <<: *copr-actions-pr
    post-upstream-clone:
      # builds from main branch should have the highest NVR
      - sed -i "s/1%{?dist}/100%{?dist}/g" packaging/leapp.spec

  copr-build-base: &copr-build-base
    job: copr_build
    owner: "@oamg"
    project: leapp
    targets:
      - epel-8-x86_64
      - epel-9-x86_64
      - fedora-all-aarch64
      - fedora-all-x86_64

  # -------------------------------------------------------------------- #
  # Testing Farm provisioning and artifacts                               #
  # -------------------------------------------------------------------- #
  provisioning-settings: &provisioning-settings
    provisioning:
      tags:
        BusinessUnit: sst_upgrades@leapp_upstream_test

  artifacts-rhel8: &artifacts-rhel8
    - type: "repository"
      id: "https://download.copr.fedorainfracloud.org/results/@oamg/leapp/epel-8-x86_64/"
      packages:
        - leapp-upgrade-el8toel9
        - leapp-upgrade-el8toel9-deps
        - python3-leapp
      order: 40

  artifacts-rhel9: &artifacts-rhel9
    - type: "repository"
      id: "https://download.copr.fedorainfracloud.org/results/@oamg/leapp/epel-9-x86_64/"
      packages:
        - leapp-upgrade-el9toel10
        - leapp-upgrade-el9toel10-deps
        - python3-leapp
      order: 40

  # -------------------------------------------------------------------- #
  # tmt plan filters                                                      #
  # -------------------------------------------------------------------- #
  filter-8to9-tier0: &filter-8to9-tier0
    tmt:
      plan_filter: 'tag:8to9 & tag:tier0 & enabled:true & tag:-rhsm'
  filter-8to9-partitioning: &filter-8to9-partitioning
    tmt:
      plan_filter: 'tag:8to9 & tag:partitioning & tag:tier0 & enabled:true & tag:-rhsm'
  filter-8to9-kernel-rt: &filter-8to9-kernel-rt
    tmt:
      plan_filter: 'tag:8to9 & tag:kernel-rt & tag:tier0 & enabled:true & tag:-rhsm'
  filter-8to9-aws: &filter-8to9-aws
    tmt:
      plan_filter: 'tag:8to9 & tag:rhui-aws-tier0 & enabled:true & tag:-rhsm'

  filter-9to10-tier0: &filter-9to10-tier0
    tmt:
      plan_filter: 'tag:9to10 & tag:tier0 & enabled:true & tag:-rhsm'
  filter-9to10-partitioning: &filter-9to10-partitioning
    tmt:
      plan_filter: 'tag:9to10 & tag:partitioning & enabled:true & tag:-rhsm'
  filter-9to10-kernel-rt: &filter-9to10-kernel-rt
    tmt:
      plan_filter: 'tag:9to10 & tag:kernel-rt & enabled:true & tag:-rhsm'
  filter-9to10-aws: &filter-9to10-aws
    tmt:
      plan_filter: 'tag:9to10 & tag:rhui-aws-tier0 & enabled:true & tag:-rhsm'

  # -------------------------------------------------------------------- #
  # Job templates                                                         #
  # -------------------------------------------------------------------- #
  # NOTE(pstodulk): default values in abstract jobs start from 8.10, as
  # this is the last RHEL 8 release and all new future tests will start
  # from this one release.
  tests-base: &tests-base
    job: tests
    trigger: pull_request
    fmf_url: "https://gitlab.cee.redhat.com/oamg/leapp-tests"
    fmf_ref: "next"
    use_internal_tf: true
    labels:
      - sanity

  sanity-8to9: &sanity-8to9
    <<: *tests-base
  ondemand-8to9: &ondemand-8to9
    <<: *tests-base
    manual_trigger: True
  sanity-8to9-aws: &sanity-8to9-aws
    <<: *tests-base
    labels:
      - sanity
      - aws
    targets:
      epel-8-x86_64:
        distros: [RHEL-8-rhui]

  sanity-9to10: &sanity-9to10
    <<: *tests-base
  ondemand-9to10: &ondemand-9to10
    <<: *tests-base
    manual_trigger: True
  sanity-9to10-aws: &sanity-9to10-aws
    <<: *tests-base
    labels:
      - sanity
      - aws
    targets:
      epel-9-x86_64:
        distros: [RHEL-9-rhui]

  # -------------------------------------------------------------------- #
  # Upgrade paths                                                         #
  # -------------------------------------------------------------------- #
  # Each path has exactly two anchors and they are the only place its
  # version numbers appear:
  #   path-*  -> what the job runs on   (targets + SOURCE/TARGET_RELEASE)
  #   tfenv-* -> the Testing Farm environment (artifacts + tmt context)
  # Add a new upgrade path by adding one pair here, then the jobs below.
  # -------------------------------------------------------------------- #

  # --- RHEL 8 -> RHEL 9 ------------------------------------------------ #
  path-rhel8_10-to-rhel9_8: &path-rhel8_10-to-rhel9_8
    targets:
      epel-8-x86_64:
        distros: [RHEL-8.10.0-Nightly]
    env:
      SOURCE_RELEASE: "8.10"
      TARGET_RELEASE: "9.8"
  tfenv-rhel8_10-to-rhel9_8: &tfenv-rhel8_10-to-rhel9_8
    artifacts: *artifacts-rhel8
    tmt:
      context:
        distro: "rhel-8.10"
        distro_target: "rhel-9.8"
    settings: *provisioning-settings

  path-rhel8_10-to-rhel9_9: &path-rhel8_10-to-rhel9_9
    targets:
      epel-8-x86_64:
        distros: [RHEL-8.10.0-Nightly]
    env:
      SOURCE_RELEASE: "8.10"
      TARGET_RELEASE: "9.9"
  tfenv-rhel8_10-to-rhel9_9: &tfenv-rhel8_10-to-rhel9_9
    artifacts: *artifacts-rhel8
    tmt:
      context:
        distro: "rhel-8.10"
        distro_target: "rhel-9.9"
    settings: *provisioning-settings

  path-rhel8_10-to-rhel9_10: &path-rhel8_10-to-rhel9_10
    targets:
      epel-8-x86_64:
        distros: [RHEL-8.10.0-Nightly]
    env:
      SOURCE_RELEASE: "8.10"
      TARGET_RELEASE: "9.10"
  tfenv-rhel8_10-to-rhel9_10: &tfenv-rhel8_10-to-rhel9_10
    artifacts: *artifacts-rhel8
    tmt:
      context:
        distro: "rhel-8.10"
        distro_target: "rhel-9.10"
    settings: *provisioning-settings

  # --- RHEL 9 -> RHEL 10 ----------------------------------------------- #
  path-rhel9_8-to-rhel10_2: &path-rhel9_8-to-rhel10_2
    targets:
      epel-9-x86_64:
        distros: [RHEL-9.8.0-Nightly]
    env:
      SOURCE_RELEASE: "9.8"
      TARGET_RELEASE: "10.2"
  tfenv-rhel9_8-to-rhel10_2: &tfenv-rhel9_8-to-rhel10_2
    artifacts: *artifacts-rhel9
    tmt:
      context:
        distro: "rhel-9.8"
        distro_target: "rhel-10.2"
    settings: *provisioning-settings

  path-rhel9_9-to-rhel10_3: &path-rhel9_9-to-rhel10_3
    targets:
      epel-9-x86_64:
        distros: [RHEL-9.9.0-Nightly]
    env:
      SOURCE_RELEASE: "9.9"
      TARGET_RELEASE: "10.3"
  tfenv-rhel9_9-to-rhel10_3: &tfenv-rhel9_9-to-rhel10_3
    artifacts: *artifacts-rhel9
    tmt:
      context:
        distro: "rhel-9.9"
        distro_target: "rhel-10.3"
    settings: *provisioning-settings

  path-rhel9_10-to-rhel10_4: &path-rhel9_10-to-rhel10_4
    targets:
      epel-9-x86_64:
        distros: [RHEL-9.10.0-Nightly]
    env:
      SOURCE_RELEASE: "9.10"
      TARGET_RELEASE: "10.4"
  tfenv-rhel9_10-to-rhel10_4: &tfenv-rhel9_10-to-rhel10_4
    artifacts: *artifacts-rhel9
    tmt:
      context:
        distro: "rhel-9.10"
        distro_target: "rhel-10.4"
    settings: *provisioning-settings

  # --- CentOS Stream 9 -> RHEL 10 / CentOS Stream 10 ------------------- #
  path-centos9-to-rhel10_3: &path-centos9-to-rhel10_3
    targets:
      epel-9-x86_64:
        distros: [CentOS-Stream-9]
    env:
      SOURCE_RELEASE: "9"
      TARGET_RELEASE: "10.3"
  tfenv-centos9-to-rhel10_3: &tfenv-centos9-to-rhel10_3
    artifacts: *artifacts-rhel9
    tmt:
      context:
        distro: "centos-9"
        distro_target: "rhel-10.3"
    settings: *provisioning-settings

  path-centos9-to-rhel10_4: &path-centos9-to-rhel10_4
    targets:
      epel-9-x86_64:
        distros: [CentOS-Stream-9]
    env:
      SOURCE_RELEASE: "9"
      TARGET_RELEASE: "10.4"
  tfenv-centos9-to-rhel10_4: &tfenv-centos9-to-rhel10_4
    artifacts: *artifacts-rhel9
    tmt:
      context:
        distro: "centos-9"
        distro_target: "rhel-10.4"
    settings: *provisioning-settings

  path-centos9-to-centos10: &path-centos9-to-centos10
    targets:
      epel-9-x86_64:
        distros: [CentOS-Stream-9]
    env:
      SOURCE_RELEASE: "9"
      TARGET_RELEASE: "10"
      TARGET_OS: "centos"
  tfenv-centos9-to-centos10: &tfenv-centos9-to-centos10
    artifacts: *artifacts-rhel9
    tmt:
      context:
        distro: "centos-9"
        distro_target: "centos-10"
    settings: *provisioning-settings

  # --- AlmaLinux / Rocky Linux / Oracle Linux 9.8 -> RHEL 10.2 --------- #
  path-alma9_8-to-rhel10_2: &path-alma9_8-to-rhel10_2
    targets:
      epel-9-x86_64:
        distros: ['AlmaLinux OS 9.8.20260526 x86_64']
    env:
      SOURCE_RELEASE: "9.8"
      TARGET_RELEASE: "10.2"
      LEAPP_UNSUPPORTED: 1 # 9.8 is defined as unsupported ATM, will be superseded by 9.9
      LEAPP_DEVEL_SKIP_CHECK_OS_RELEASE: 1 # 9.8 is defined as unsupported ATM, will be superseded by 9.9
  tfenv-alma9_8-to-rhel10_2: &tfenv-alma9_8-to-rhel10_2
    artifacts: *artifacts-rhel9
    tmt:
      context:
        distro: "alma-9.8"
        distro_target: "rhel-10.2"
    settings: *provisioning-settings

  path-rocky9_8-to-rhel10_2: &path-rocky9_8-to-rhel10_2
    targets:
      epel-9-x86_64:
        distros: ['Rocky-9-EC2-Base-9.8-20260525.0.x86_64']
    env:
      SOURCE_RELEASE: "9.8"
      TARGET_RELEASE: "10.2"
  tfenv-rocky9_8-to-rhel10_2: &tfenv-rocky9_8-to-rhel10_2
    artifacts: *artifacts-rhel9
    tmt:
      context:
        distro: "rocky-9.8"
        distro_target: "rhel-10.2"
    settings: *provisioning-settings

  path-oracle9_8-to-rhel10_2: &path-oracle9_8-to-rhel10_2
    targets:
      epel-9-x86_64:
        distros: ['Oracle:Oracle-Linux:ol98-lvm:9.8.2']
    env:
      SOURCE_RELEASE: "9.8"
      TARGET_RELEASE: "10.2"
  tfenv-oracle9_8-to-rhel10_2: &tfenv-oracle9_8-to-rhel10_2
    artifacts: *artifacts-rhel9
    tmt:
      context:
        distro: "oracle-9.8"
        distro_target: "rhel-10.2"
    settings: *provisioning-settings
    # Oracle Linux images are only available from the Azure pool
    pool: "azure-oamg"

# ====================================================================== #
# Jobs                                                                   #
# ---------------------------------------------------------------------- #
# `<<: [*template, *path]` merges both; keys written directly in the job  #
# always win over either. Earlier anchors in the list win over later ones #
# (that is how the RHUI AWS jobs keep their own `targets`).               #
# ====================================================================== #
jobs:

# ---------------------------------------------------------------------- #
# copr builds                                                            #
# ---------------------------------------------------------------------- #
- <<: *copr-build-base
  trigger: pull_request
  actions: *copr-actions-pr

- <<: *copr-build-base
  trigger: commit
  branch: main
  actions: *copr-actions-main

# ---------------------------------------------------------------------- #
# RHEL 8.10 -> RHEL 9.8                                                  #
# ---------------------------------------------------------------------- #
- <<: [*sanity-8to9, *path-rhel8_10-to-rhel9_8]
  identifier: sanity-8.10_to_9.8
  tf_extra_params:
    test: *filter-8to9-tier0
    environments:
      - *tfenv-rhel8_10-to-rhel9_8

# On-demand partitioning (beaker-minimal) tests
- <<: [*ondemand-8to9, *path-rhel8_10-to-rhel9_8]
  identifier: on-demand-8.10_to_9.8-partitioning
  labels:
    - partitioning
    - beaker-minimal
    - beaker-minimal-8.10to9.8
    - 8.10to9.8
  tf_extra_params:
    test: *filter-8to9-partitioning
    environments:
      - *tfenv-rhel8_10-to-rhel9_8

# On-demand kernel-rt tests
- <<: [*ondemand-8to9, *path-rhel8_10-to-rhel9_8]
  identifier: on-demand-8.10_to_9.8-kernel-rt
  labels:
    - kernel-rt
    - kernel-rt-8.10to9.8
    - 8.10to9.8
  tf_extra_params:
    test: *filter-8to9-kernel-rt
    environments:
      - *tfenv-rhel8_10-to-rhel9_8

- <<: [*sanity-8to9-aws, *path-rhel8_10-to-rhel9_8]
  identifier: sanity-RHUI_AWS_8.10_to_9.8
  tf_extra_params:
    test: *filter-8to9-aws
    environments:
      - *tfenv-rhel8_10-to-rhel9_8

# ---------------------------------------------------------------------- #
