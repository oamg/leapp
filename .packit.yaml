specfile_path: packaging/leapp.spec

upstream_project_url: https://github.com/oamg/leapp
merge_pr_in_ci: false

srpm_build_deps: []

osh_diff_scan_after_copr_build: false

_:
  sanity-abstract-8to9: &sanity-abstract-8to9
    job: tests
    trigger: pull_request
    fmf_url: "https://gitlab.cee.redhat.com/oamg/leapp-tests"
    fmf_ref: "next"
    use_internal_tf: True
    labels:
      - sanity
    targets:
      epel-8-x86_64:
        distros: [RHEL-8.10.0-Nightly]
    tf_extra_params:
      environments:
        - &tmt-env-settings-8_10-to-9_6
          artifacts: &artifacts-for-rhel8
            - type: "repository"
              id: "https://download.copr.fedorainfracloud.org/results/@oamg/leapp/epel-8-x86_64/"
              packages:
                - leapp-upgrade-el8toel9
                - leapp-upgrade-el8toel9-deps
                - python3-leapp
              order: 40
          tmt:
            context: &tmt-context-8_10-to-9_6
              distro: "rhel-8.10"
              distro_target: "rhel-9.6"
          settings: &default-provisioning-settings
            provisioning:
              tags:
                BusinessUnit: sst_upgrades@leapp_upstream_test
        - &tmt-env-settings-8_10-to-9_8
          artifacts: *artifacts-for-rhel8
          tmt:
            context: &tmt-context-8_10-to-9_8
              distro: "rhel-8.10"
              distro_target: "rhel-9.8"
          settings: *default-provisioning-settings
        - &tmt-env-settings-8_10-to-9_9
          artifacts: *artifacts-for-rhel8
          tmt:
            context: &tmt-context-8_10-to-9_9
              distro: "rhel-8.10"
              distro_target: "rhel-9.9"
          settings: *default-provisioning-settings

  sanity-abstract-8to9-aws: &sanity-abstract-8to9-aws
    <<: *sanity-abstract-8to9
    labels:
      - sanity
      - aws
    targets:
      epel-8-x86_64:
        distros: [RHEL-8-rhui]

  ondemand-8to9-abstract: &ondemand-8to9-abstract
    <<: *sanity-abstract-8to9
    manual_trigger: True

  sanity-abstract-9to10: &sanity-abstract-9to10
    job: tests
    trigger: pull_request
    fmf_url: "https://gitlab.cee.redhat.com/oamg/leapp-tests"
    fmf_ref: "next"
    use_internal_tf: True
    labels:
      - sanity
    targets:
      epel-9-x86_64:
        distros: [RHEL-9.9.0-Nightly]
    tf_extra_params:
      environments:
        - &tmt-env-settings-centos-9-to-10
          artifacts: &artifacts-for-rhel9
            - type: "repository"
              id: "https://download.copr.fedorainfracloud.org/results/@oamg/leapp/epel-9-x86_64/"
              packages:
                - leapp-upgrade-el9toel10
                - leapp-upgrade-el9toel10-deps
                - python3-leapp
              order: 40
          tmt:
            context: &tmt-context-centos-9-to-10
              distro: "centos-9"
              distro_target: "centos-10"
          settings: *default-provisioning-settings
        - &tmt-env-settings-9_6-to-10_0
          artifacts: *artifacts-for-rhel9
          tmt:
            context: &tmt-context-9_6-to-10_0
              distro: "rhel-9.6"
              distro_target: "rhel-10.0"
          settings: *default-provisioning-settings
        - &tmt-env-settings-9_8-to-10_2
          artifacts: *artifacts-for-rhel9
          tmt:
            context: &tmt-context-9_8-to-10_2
              distro: "rhel-9.8"
              distro_target: "rhel-10.2"
          settings: *default-provisioning-settings
        - &tmt-env-settings-centos-9-to-rhel-10_2
          artifacts: *artifacts-for-rhel9
          tmt:
            context: &tmt-context-centos-9-to-rhel-10_2
              distro: "centos-9"
              distro_target: "rhel-10.2"
          settings: *default-provisioning-settings
        - &tmt-env-settings-9_9-to-10_3
          artifacts: *artifacts-for-rhel9
          tmt:
            context: &tmt-context-9_9-to-10_3
              distro: "rhel-9.9"
              distro_target: "rhel-10.3"
          settings: *default-provisioning-settings
        - &tmt-env-settings-centos-9-to-rhel-10_3
          artifacts: *artifacts-for-rhel9
          tmt:
            context: &tmt-context-centos-9-to-rhel-10_3
              distro: "centos-9"
              distro_target: "rhel-10.3"
          settings: *default-provisioning-settings

  sanity-abstract-9to10-aws: &sanity-abstract-9to10-aws
    <<: *sanity-abstract-9to10
    labels:
      - sanity
      - aws
    targets:
      epel-9-x86_64:
        distros: [RHEL-9-rhui]

  ondemand-9to10-abstract: &ondemand-9to10-abstract
    <<: *sanity-abstract-9to10
    manual_trigger: True

jobs:
- job: copr_build
  trigger: pull_request
  owner: "@oamg"
  project: leapp
  targets:
  - epel-8-x86_64
  - epel-9-x86_64
  - fedora-all-aarch64
  - fedora-all-x86_64
  actions:
    post-upstream-clone:
    # builds from PRs should have lower NVR than those from main branch
    - sed -i "s/1%{?dist}/0%{?dist}/g" packaging/leapp.spec
    get-current-version:
    # get version from spec file instead from git tag
    - bash -c "grep -m1 '^Version:' packaging/leapp.spec | grep -om1 '[0-9].[0-9.]**'"

- job: copr_build
  trigger: commit
  branch: main
  owner: "@oamg"
  project: leapp
  targets:
  - epel-8-x86_64
  - epel-9-x86_64
  - fedora-all-aarch64
  - fedora-all-x86_64
  actions:
    post-upstream-clone:
    # builds from main branch should have the highest NVR
    - sed -i "s/1%{?dist}/100%{?dist}/g" packaging/leapp.spec
    get-current-version:
    # get version from spec file instead from git tag
    - bash -c "grep -m1 '^Version:' packaging/leapp.spec | grep -om1 '[0-9].[0-9.]**'"

# NOTE: to see what envars, targets, .. can be set in tests, see
# the configuration of tests here:
#  7toX path https://gitlab.cee.redhat.com/oamg/leapp-tests/-/blob/rhel7/config.yaml
# >7tox path https://gitlab.cee.redhat.com/oamg/leapp-tests/-/blob/main/config.yaml
