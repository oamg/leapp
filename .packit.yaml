#NOTE(pstodulk) putting default values in abstract jobs as from 8.10, as this
# is the last RHEL 8 release and all new future tests will start from this
# one release.

# NOTE: shared 8-to-9 abstract test definitions now live under the
# top-level `_:` placeholder above (see packit docs: 'yaml anchors'),
# so they don't need a dummy `trigger: ignore` job entry here anymore.

