# ###################################################################### #

- &sanity-8_10-to-9_6
  <<: *sanity-abstract-8to9
  identifier: sanity-8.10_to_9.6
  tf_extra_params:
    test: &plan-filter-8to9-tier0
      tmt:
        plan_filter: 'tag:8to9 & tag:tier0 & enabled:true & tag:-rhsm'
    environments:
      - *tmt-env-settings-8_10-to-9_6
  env: &env-8_10-to-9_6
    SOURCE_RELEASE: "8.10"
    TARGET_RELEASE: "9.6"

# On-demand minimal beaker tests
- &beaker-minimal-8_10-to-9_6-ondemand
  <<: *ondemand-8to9-abstract
  labels:
    - beaker-minimal
    - beaker-minimal-8.10to9.6
    - 8.10to9.6
  identifier: on-demand-8.10_to_9.6-beaker-minimal
  tf_extra_params:
    test: &plan-filter-8to9-beaker-minimal
      tmt:
        plan_filter: 'tag:8to9 & tag:partitioning & enabled:true & tag:-rhsm'
    environments:
      - *tmt-env-settings-8_10-to-9_6
  env:
    <<: *env-8_10-to-9_6

